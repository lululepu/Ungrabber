[package]
name = "PyinstUnpack"
version = "0.1.0"
edition = "2024"

[dependencies]
memmap2 = "0.9.11"
memchr = "2.8.3"
libdeflater = "1.26.0"
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py310", "experimental-inspect"] }

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"
